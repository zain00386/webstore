name: Deploy
# Hostinger deploys from omar-gg1/webstore, so every push to main here is copied there.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to omar-gg1/webstore
        env:
          KEY: ${{ secrets.OMAR_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Add the OMAR_DEPLOY_KEY secret to this repo first."; exit 1; fi
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          # --force: the omar repo is only a deploy copy, this repo is the source of truth.
          git push --force git@github.com:omar-gg1/webstore.git HEAD:main
